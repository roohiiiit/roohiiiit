<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 230" width="800" height="230" role="img" aria-label="Rohit Fernantez Player Stats - RDR2 Style">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#17100e"/>
      <stop offset="100%" stop-color="#0e0908"/>
    </linearGradient>
    <linearGradient id="crimsonBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="goldBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="amberBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <style>
      .mono { font-family: "Courier New", Courier, monospace; }
      .serif { font-family: Georgia, "Times New Roman", serif; }
    </style>
  </defs>

  <!-- Card Background & Double Western Border -->
  <rect width="800" height="230" rx="6" fill="url(#bg)"/>
  <rect x="6" y="6" width="788" height="218" rx="4" fill="none" stroke="#8b6b43" stroke-width="2"/>
  <rect x="11" y="11" width="778" height="208" rx="2" fill="none" stroke="#3d2c1e" stroke-width="1"/>

  <!-- Corner Rivets -->
  <rect x="14" y="14" width="4" height="4" fill="#d97706"/>
  <rect x="782" y="14" width="4" height="4" fill="#d97706"/>
  <rect x="14" y="212" width="4" height="4" fill="#d97706"/>
  <rect x="782" y="212" width="4" height="4" fill="#d97706"/>

  <!-- Top Header -->
  <text x="28" y="36" class="serif" font-size="16" font-weight="bold" fill="#f59e0b" letter-spacing="2">COMPENDIUM // PLAYER STATS</text>
  <text x="772" y="36" class="mono" font-size="11" font-weight="bold" fill="#ef4444" text-anchor="end" letter-spacing="1">HONOR: HIGH  •  BOUNTY: $0.00</text>
  <line x1="28" y1="47" x2="772" y2="47" stroke="#7f1d1d" stroke-width="2"/>
  <line x1="28" y1="49" x2="772" y2="49" stroke="#451a03" stroke-width="1"/>

  <!-- Left Column: Character Details -->
  <text x="28" y="76" class="mono" font-size="11" font-weight="bold" fill="#b89b72">NAME</text>
  <text x="112" y="76" class="serif" font-size="14" font-weight="bold" fill="#f7efe2">Rohit Fernantez</text>

  <text x="28" y="105" class="mono" font-size="11" font-weight="bold" fill="#b89b72">CLASS</text>
  <text x="112" y="105" class="mono" font-size="13" font-weight="bold" fill="#fbbf24">AI/ML &amp; Full-Stack Dev</text>

  <text x="28" y="134" class="mono" font-size="11" font-weight="bold" fill="#b89b72">GUILD</text>
  <text x="112" y="134" class="mono" font-size="13" font-weight="bold" fill="#f7efe2">Kochi.Code (Founder)</text>

  <text x="28" y="163" class="mono" font-size="11" font-weight="bold" fill="#b89b72">LEVEL</text>
  <text x="112" y="163" class="mono" font-size="13" font-weight="bold" fill="#f87171">B.Tech AI/ML</text>

  <text x="28" y="192" class="mono" font-size="11" font-weight="bold" fill="#b89b72">REALM</text>
  <text x="112" y="192" class="mono" font-size="13" font-weight="bold" fill="#f7efe2">Kerala, India</text>

  <!-- Vertical Divider -->
  <line x1="400" y1="60" x2="400" y2="205" stroke="#3d2c1e" stroke-width="1.5"/>

  <!-- Right Column: Attributes (RDR2 Segmented Bars) -->
  <text x="424" y="74" class="serif" font-size="13" font-weight="bold" fill="#e5b869" letter-spacing="1.5">ATTRIBUTES</text>

  <!-- HTML/CSS/JS: 80% (8/10) -->
  <text x="424" y="102" class="mono" font-size="12" font-weight="bold" fill="#f7efe2">HTML / CSS / JS</text>
  <text x="772" y="102" class="mono" font-size="12" font-weight="bold" fill="#f59e0b" text-anchor="end">80%</text>
  <g transform="translate(424, 108)">
    <rect x="0" y="0" width="31" height="10" rx="1" fill="url(#amberBar)"/>
    <rect x="35" y="0" width="31" height="10" rx="1" fill="url(#amberBar)"/>
    <rect x="70" y="0" width="31" height="10" rx="1" fill="url(#amberBar)"/>
    <rect x="105" y="0" width="31" height="10" rx="1" fill="url(#amberBar)"/>
    <rect x="140" y="0" width="31" height="10" rx="1" fill="url(#amberBar)"/>
    <rect x="175" y="0" width="31" height="10" rx="1" fill="url(#amberBar)"/>
    <rect x="210" y="0" width="31" height="10" rx="1" fill="url(#amberBar)"/>
    <rect x="245" y="0" width="31" height="10" rx="1" fill="url(#amberBar)"/>
    <rect x="280" y="0" width="31" height="10" rx="1" fill="#2a1f1a" stroke="#3d2c1e" stroke-width="1"/>
    <rect x="315" y="0" width="31" height="10" rx="1" fill="#2a1f1a" stroke="#3d2c1e" stroke-width="1"/>
  </g>

  <!-- Python: 60% (6/10) -->
  <text x="424" y="140" class="mono" font-size="12" font-weight="bold" fill="#f7efe2">PYTHON</text>
  <text x="772" y="140" class="mono" font-size="12" font-weight="bold" fill="#fbbf24" text-anchor="end">60%</text>
  <g transform="translate(424, 146)">
    <rect x="0" y="0" width="31" height="10" rx="1" fill="url(#goldBar)"/>
    <rect x="35" y="0" width="31" height="10" rx="1" fill="url(#goldBar)"/>
    <rect x="70" y="0" width="31" height="10" rx="1" fill="url(#goldBar)"/>
    <rect x="105" y="0" width="31" height="10" rx="1" fill="url(#goldBar)"/>
    <rect x="140" y="0" width="31" height="10" rx="1" fill="url(#goldBar)"/>
    <rect x="175" y="0" width="31" height="10" rx="1" fill="url(#goldBar)"/>
    <rect x="210" y="0" width="31" height="10" rx="1" fill="#2a1f1a" stroke="#3d2c1e" stroke-width="1"/>
    <rect x="245" y="0" width="31" height="10" rx="1" fill="#2a1f1a" stroke="#3d2c1e" stroke-width="1"/>
    <rect x="280" y="0" width="31" height="10" rx="1" fill="#2a1f1a" stroke="#3d2c1e" stroke-width="1"/>
    <rect x="315" y="0" width="31" height="10" rx="1" fill="#2a1f1a" stroke="#3d2c1e" stroke-width="1"/>
  </g>

  <!-- AI / ML: 40% (4/10) -->
  <text x="424" y="178" class="mono" font-size="12" font-weight="bold" fill="#f7efe2">AI / ML</text>
  <text x="772" y="178" class="mono" font-size="12" font-weight="bold" fill="#ef4444" text-anchor="end">40%</text>
  <g transform="translate(424, 184)">
    <rect x="0" y="0" width="31" height="10" rx="1" fill="url(#crimsonBar)"/>
    <rect x="35" y="0" width="31" height="10" rx="1" fill="url(#crimsonBar)"/>
    <rect x="70" y="0" width="31" height="10" rx="1" fill="url(#crimsonBar)"/>
    <rect x="105" y="0" width="31" height="10" rx="1" fill="url(#crimsonBar)"/>
    <rect x="140" y="0" width="31" height="10" rx="1" fill="#2a1f1a" stroke="#3d2c1e" stroke-width="1"/>
    <rect x="175" y="0" width="31" height="10" rx="1" fill="#2a1f1a" stroke="#3d2c1e" stroke-width="1"/>
    <rect x="210" y="0" width="31" height="10" rx="1" fill="#2a1f1a" stroke="#3d2c1e" stroke-width="1"/>
    <rect x="245" y="0" width="31" height="10" rx="1" fill="#2a1f1a" stroke="#3d2c1e" stroke-width="1"/>
    <rect x="280" y="0" width="31" height="10" rx="1" fill="#2a1f1a" stroke="#3d2c1e" stroke-width="1"/>
    <rect x="315" y="0" width="31" height="10" rx="1" fill="#2a1f1a" stroke="#3d2c1e" stroke-width="1"/>
  </g>

  <!-- Footer Flavor -->
  <text x="772" y="211" class="mono" font-size="9" fill="#9c8263" text-anchor="end">DEAD EYE: ACTIVE  |  CORES: CHARGED</text>
</svg>
